[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scrublog"
version = "0.1.0"
description = "Strip ANSI escape codes from logs, byte streams, and CLI output. Plug-and-play."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "prasad-a-abhishek", email = "abhishek@prasadlabs.dev"}]
keywords = ["ansi", "escape", "strip", "log", "cli", "terminal", "color"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
scrublog = "scrublog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
